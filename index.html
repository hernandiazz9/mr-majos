<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Majo's | Landing Versions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f0f0f;
            color: #f3f3f3;
        }
        h1, h2, h3, .brand-font {
            font-family: 'Anton', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .text-accent { color: #FF4500; }
        .bg-accent { background-color: #FF4500; }

        .version-card {
            transition: all 0.3s ease;
        }
        .version-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(255, 69, 0, 0.15);
            border-color: #FF4500;
        }
        .version-card .version-number {
            transition: all 0.3s ease;
        }
        .version-card:hover .version-number {
            color: #FF4500;
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.5);
        }
    </style>
</head>
<body class="antialiased selection:bg-orange-500 selection:text-white min-h-screen flex flex-col">

    <nav class="w-full bg-black/80 backdrop-blur-md border-b border-zinc-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-center">
            <div class="text-3xl brand-font text-white tracking-widest">
                MR. <span class="text-accent">MAJO'S</span>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-6xl mb-4">LANDING <span class="text-accent">VERSIONS</span></h1>
            <p class="text-gray-400 text-lg max-w-md mx-auto">Cada versión es una iteración del diseño. Hacé click para ver cada una.</p>
        </div>

        <div id="versions-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-4xl w-full">
        </div>

        <p class="text-zinc-600 text-sm mt-12">Agregá nuevas versiones en la carpeta <code class="bg-zinc-800 px-2 py-1 rounded text-zinc-400">/versions/</code></p>
    </main>

    <footer class="py-6 border-t border-zinc-800 text-center">
        <p class="text-gray-600 text-sm">&copy; 2024 Mr. Majo's &mdash; Alicante, Espana</p>
    </footer>

    <script>
        const versions = [
            { id: 'v0', label: 'V0', description: 'Landing original - Food Porn & Burgers' },
            { id: 'v1', label: 'V1', description: 'Brutal dark - Neon, marquee & scroll reveal' },
        ];

        const grid = document.getElementById('versions-grid');

        versions.forEach((v) => {
            const card = document.createElement('a');
            card.href = `versions/${v.id}.html`;
            card.className = 'version-card block bg-zinc-900 border border-zinc-800 rounded-2xl p-8 text-center cursor-pointer';
            card.innerHTML = `
                <div class="version-number text-5xl md:text-6xl brand-font text-white mb-4">${v.label}</div>
                <p class="text-gray-400 text-sm">${v.description}</p>
                <div class="mt-6 inline-flex items-center gap-2 text-sm font-semibold text-zinc-500 group-hover:text-accent">
                    Ver landing &rarr;
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
